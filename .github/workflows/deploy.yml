name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist

      # Deploys to Cloudflare Pages once the repo has these two secrets:
      #   CLOUDFLARE_API_TOKEN  (token with "Workers Scripts: Edit" + "Workers Routes: Edit")
      #   CLOUDFLARE_ACCOUNT_ID
      # Without them this step is skipped and the build still goes green.
      - name: Deploy to Cloudflare (static assets)
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
